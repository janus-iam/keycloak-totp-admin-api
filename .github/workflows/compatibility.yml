name: Keycloak compatibility matrix

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly run to catch breakage introduced by new Keycloak releases.
    # Renovate (renovate.json5) keeps each pin on the latest patch of that minor.
    # Add a new list entry when a new minor is published.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  compile-and-test:
    name: Keycloak ${{ matrix.keycloak }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keycloak >= 26.3 is required: the admin permission evaluators moved to
        # org.keycloak.services.resources.admin.fgap in 26.3.0.
        # Quoted x.y.z pins are updated by Renovate. Stay on the same minor;
        # add a new line when a new minor is released.
        keycloak:
          - "26.3.5"
          - "26.4.7"
          - "26.5.7"
          - "26.6.4"
          - "26.7.4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile and run tests against Keycloak ${{ matrix.keycloak }}
        run: mvn -B -Dkeycloak.version=${{ matrix.keycloak }} clean verify

  # Covers a Renovate bump of keycloak.version before that minor is added to the matrix.
  declared-version:
    name: Keycloak version declared in pom.xml
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile and run tests against keycloak.version from pom.xml
        run: mvn -B clean verify
